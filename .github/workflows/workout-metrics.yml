name: Workout metric regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  metrics-recovery-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.metrics.config.mjs

  metrics-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Legacy rollback and metric lifecycle on an owned disposable stack
        run: bash supabase/tests/workout_metrics/run.sh
