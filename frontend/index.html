<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F4EF" />
    <!-- Sunrise/sunset theme before first paint (same rule as src/lib/theme.js). -->
    <script>
      (function () {
        var c = 'system';
        try { c = localStorage.getItem('cvf_theme') || 'system'; } catch (e) {}
        var dark = c === 'dark' || (c !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        if (dark) r.classList.add('dark');
        r.setAttribute('data-theme', dark ? 'dark' : 'light');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#161211' : '#F6F4EF');
      })();
    </script>
    <meta name="description" content="CVF PT — Core Value Fitness personal training management. Fitness Done Right." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Self-hosted brand fonts: preload the latin files so the auth
         screen's first paint never waits on a late font discovery. -->
    <link rel="preload" href="/fonts/oswald-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CVF PT" />
    <title>CVF PT | Core Value Fitness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
